services:
  churn_pred_service:
    build: ./services/churn_pred_service
    container_name: churn_pred_service
    # Порты наружу не публикуются: доступ только по внутренней сети compose
    volumes:
      # Монтируем папку data_science внутрь контейнера для доступа к модели и test'y.
      - ./data_science:/opt/data_science
    environment:
      - MODEL_PATH=/opt/data_science/artifacts/best_model.cbm
      - DATA_PATH=/opt/data_science/data/raw/test.csv
      - PYTHONPATH=/opt/data_science/src            # Для прямых импортов
      - DATA_SCIENCE_SRC=/opt/data_science/src      # Для sys.path в коде      
    restart: unless-stopped

  embedding_service:
    build: 
      context: .
      dockerfile: ./services/embedding_service/Dockerfile 
    container_name: embedding_service
    volumes:
      - app-cache:/app/.cache
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DEVICE=cpu
      - EMBEDDING_SERVICE_URL=http://embedding_service:3020
      - EMBEDDER_TYPE=frida
      - MODEL_PATH=ai-forever/FRIDA
      - TOKENIZER_MAX_LENGTH=512
      - EMBEDDING_PORT=3020
      - HF_HOME=/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  vllm:
    build:
      context: ./services/vllm
      dockerfile: Dockerfile
    container_name: vllm
    env_file:
      - ./services/vllm/.env  # Для варьирования параметров без ребилда
    ports:
      - "3040:8901"  # единственный внутренний сервис с портом на хосте: dev-режим агента (make run-agent) и отладка LLM
    volumes:
      - vllm-models:/root/.cache/huggingface # Чтобы не качать модель заново каждый раз
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.16.2
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./infra/qdrant/storage:/qdrant/storage       # Хранение векторных баз
      - ./infra/qdrant/snapshots:/qdrant/snapshots   # Хранение снапшотов
    restart: unless-stopped

  agent_service:
    build:
      context: .
      dockerfile: ./services/agent_service/Dockerfile
    container_name: agent_service
    environment:
      - SERVICE_NAME=agent_service
      - LOG_TO_FILE=false
      # --- LLM: vLLM в compose-сети (тяжёлый контейнер поднимается отдельно, make up его не включает) ---
      # Значения по умолчанию можно переопределить в .env корня репозитория без правки compose:
      # например, LLM_BASE_URL=http://host.docker.internal:3040/v1 — vLLM, развёрнутый на хосте.
      - ACTIVE_LLM_PROFILE=local_qwen_agent
      - LLM_BASE_URL=${LLM_BASE_URL:-http://vllm:8901/v1}
      - LLM_MODEL=${LLM_MODEL:-Qwen3.6}
      # --- Зависимости агента в compose-сети ---
      - CHURN_PRED_SERVICE_URL=http://churn_pred_service:3010
      - EMBEDDING_SERVICE_URL=http://embedding_service:3020
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=policies
      # --- Данные: CSV-выгрузка read-only, состояние (checkpointer + БД клиентов) в volume ---
      - CLIENTS_CSV_PATH=/data/test.csv
      - CHECKPOINT_DB_PATH=/data/checkpoints.db
      - CLIENTS_DB_PATH=/data/clients.db
    volumes:
      - ./data_science/data/raw/test.csv:/data/test.csv:ro
      - agent-data:/data
    # DNS-имя хоста внутри контейнера — для LLM_BASE_URL=http://host.docker.internal:PORT/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - churn_pred_service
      - embedding_service
      - qdrant
    restart: unless-stopped

  frontend_service:
    build:
      context: .
      dockerfile: ./services/frontend_service/Dockerfile
    container_name: frontend_service
    ports:
      - "3050:3050"  # единственный пользовательский порт: UI + прокси на agent_service
    environment:
      - SERVICE_NAME=frontend_service
      - LOG_TO_FILE=false
      - AGENT_SERVICE_URL=http://agent_service:7860
      - FRONTEND_PORT=3050
    depends_on:
      - agent_service
    restart: unless-stopped

  rag_indexing_service:
    profiles: ["rag_indexing"]
    build: 
      context: .
      dockerfile: ./services/rag_indexing_service/Dockerfile    
    container_name: rag_indexing_service
    volumes:
      - ./data/rag:/data/rag:ro
    environment:
      - RAG_DATA_DIR=/data/rag
      - EMBEDDING_SERVICE_URL=http://embedding_service:3020
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=policies
      - QDRANT_SPACE_NAME=text_vector
      - VECTOR_SIZE=1536
      - EMBEDDING_BATCH_SIZE=16
      - SERVICE_NAME=rag_indexing_service
    depends_on:
      - embedding_service
      - qdrant
    restart: "no"

  dev-tools:
    image: python:3.10-slim
    working_dir: /app
    profiles: ["assets"]
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app  # Пробрасываем весь проект, чтобы скрипт видел .env и мог разложить файлы
    env_file:
      - ./shared/.env
    # Добавляем переменные UID и GID, чтобы не было конфликтов прав доступа при создании файлов      
    environment:
      - HOME=/tmp
      - UID=${UID:-1000}
      - GID=${GID:-1000}
      - PYTHONPATH=/tmp/packages:/app

volumes:
  app-cache:
  vllm-models:
  agent-data: